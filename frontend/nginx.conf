server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend; keep SSE streaming unbuffered.
    location /api/ {
        # nginx allows 1 MB bodies by default. Uploads may hold up to MAX_UPLOAD_COUNT (10)
        # files of MAX_UPLOAD_BYTES (10 MiB) each, so raise this if you raise those.
        client_max_body_size 110m;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
