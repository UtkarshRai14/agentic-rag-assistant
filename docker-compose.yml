services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # Forward GOOGLE_API_KEY explicitly (compose reads it from the shell or from .env).
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Keep persisted state inside the mounted volume.
      - CHROMA_DIR=/app/state/chroma_db
      - SQLITE_PATH=/app/state/memory.sqlite
      - USERS_DB_PATH=/app/state/users.sqlite
    volumes:
      - state:/app/state
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  state:
